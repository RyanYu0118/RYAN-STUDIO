    /* ==================================================

    }

    .wws-wb-toc-anchor {
        position: absolute;

        padding: 0;

    .wws-wb-card {
        display: block;
        width: 100%;
        /* 竖长比例（窄而高），非正方形 */
        aspect-ratio: 9 / 16;
        max-height: min(72vh, 640px);
        border-radius: 12px;
        text-decoration: none !important;
        position: relative;
        overflow: hidden;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-sizing: border-box;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        --x: 50%;
        --y: 50%;
    }

    .wws-wb-glow {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-size: 200% 200%;
        animation: wws-wb-flow 15s linear infinite;
        clip-path: circle(0% at var(--x) var(--y));
        transition: clip-path 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        pointer-events: none;
    }

    .wws-wb-card--social .wws-wb-glow {
        background: linear-gradient(
            120deg,
            #120a08,
            #4a3020,
            #b45309,
            #fbbf24,
            #ffffff,
            #fbbf24,
            #b45309,
            #4a3020,
            #120a08
        );
    }

    .wws-wb-card--natural .wws-wb-glow {
        background: linear-gradient(
            120deg,
            #061210,
            #1e4d3a,
            #059669,
            #34d399,
            #ffffff,
            #34d399,
            #059669,
            #1e4d3a,
            #061210
        );
    }

    @keyframes wws-wb-flow {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }

    .wws-wb-inner {
        position: absolute;
        inset: 1px;
        border-radius: 10px;
        background: #000;
        z-index: 2;
        overflow: hidden;
    }

    .wws-wb-bg {
        position: absolute;
        inset: -10px;
        background-size: cover;
        background-position: center;
        filter: blur(2px);
        opacity: 1;
        transition: filter 0.5s ease, opacity 0.5s ease;
        z-index: 3;
    }

    .wws-wb-inner::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.45) 40%, transparent 65%);
        z-index: 5;
        pointer-events: none;
    }

    .wws-wb-body {
        position: relative;
        z-index: 6;
        height: 100%;
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        text-align: left;
    }

    .wws-wb-title {
        font-size: 36px;
        font-weight: 700;
        color: #fff;
        line-height: 1.05;
        letter-spacing: 1px;
        text-shadow: 0 4px 15px rgba(0, 0, 0, 1);
        margin: 0 0 10px 0;
        padding: 0;
        display: block;
    }

    .wws-wb-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        font-size: 13px;
        color: #d1d5db;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .wws-wb-meta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
    }

    .wws-wb-divider {
        width: 1px;
        height: 12px;
        background: rgba(255, 255, 255, 0.3);
        display: inline-block;
    }

    .wws-wb-card:hover .wws-wb-glow,
    .wws-wb-card.is-active .wws-wb-glow {
        clip-path: circle(150% at var(--x) var(--y));
        animation-duration: 2s;
    }

    .wws-wb-card.is-active {
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8);
        transform: translateY(-3px);
        border-color: transparent;
    }

    .wws-wb-card.is-active .wws-wb-bg {
        filter: blur(0);
        opacity: 0.85;
    }

    @media (max-width: 768px) {
        .wws-wb-stack {
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .wws-wb-card {
            aspect-ratio: 9 / 14;
            max-height: none;
        }
        .wws-wb-title {
            font-size: 28px;
        }
        .wws-wb-body {
            padding: 20px 18px;
        }
    }
</style>

</div>

<script>
(function () {
    var cards = document.querySelectorAll('[data-wws-wb-card]');
    if (!cards.length) return;

    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    function setGlow(card, e) {
        var rect = card.getBoundingClientRect();
        card.style.setProperty('--x', (e.clientX - rect.left) + 'px');
        card.style.setProperty('--y', (e.clientY - rect.top) + 'px');
    }

    cards.forEach(function (card) {
        if (isMobile) {
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting && entry.intersectionRatio >= 0.85) {
                        card.style.setProperty('--x', '50%');
                        card.style.setProperty('--y', '50%');
                        card.classList.add('is-active');
                    } else {
                        card.classList.remove('is-active');
                    }
                });
            }, { threshold: [0.85] });
            io.observe(card);
        } else {
            card.addEventListener('mouseenter', function (e) {
                setGlow(card, e);
                card.classList.add('is-active');
            });
            card.addEventListener('mousemove', function (e) {
                setGlow(card, e);
            });
            card.addEventListener('mouseleave', function () {
                card.style.setProperty('--x', '50%');
                card.style.setProperty('--y', '50%');
                card.classList.remove('is-active');
            });
        }
    });
})();
</script>
