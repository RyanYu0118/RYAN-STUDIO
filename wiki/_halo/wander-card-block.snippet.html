<style>
    /* ==================================================
        Wanderer World 定稿：全息冷青配色 + 技术底蕴
       ================================================== */
    
    .wander-smart-container {
        width: 100%;
        margin-top: 25px;
        box-sizing: border-box;
        padding: 10px;
    }

    /* --- 1. 字体映射 (保持与 RS-Wiki 风格一致) --- */
    .font-cn  { font-family: 'ZiHun-59-ChuangCuHei', sans-serif !important; }
    .font-en  { font-family: 'Rajdhani-Medium', sans-serif !important; }
    .font-num { font-family: 'DIN-1451-LT-Mittelschrift', sans-serif !important; }

    /* --- 2. 卡片主体 --- */
    .wd-smart-card {
        display: block;
        width: 100%;
        aspect-ratio: 2.35 / 1; 
        border-radius: 12px;
        text-decoration: none !important;
        position: relative;
        overflow: hidden; 
        background: #000;
        
        /* 初始边框：低饱和度冷灰色 */
        border: 1px solid rgba(255, 255, 255, 0.1); 
        box-sizing: border-box;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        
        transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        --x: 50%; --y: 50%;
    }

    /* --- 3. 全息流光层 (冷青色调) --- */
    .wd-rainbow-border {
        position: absolute;
        inset: 0; 
        z-index: 1; 
        
        background: linear-gradient(
            120deg, 
            #091018, /* 深墨蓝 */
            #2b4c5d, /* 青灰 */
            #0077be, /* 科技蓝 */
            #00f2ff, /* 全息青 */
            #ffffff, /* 荧光白 */
            #00f2ff, /* 全息青 */
            #0077be, /* 科技蓝 */
            #2b4c5d, /* 青灰 */
            #091018  /* 闭环 */
        );
        
        background-size: 200% 200%; 
        animation: rainbow-flow 15s linear infinite; 
        
        clip-path: circle(0% at var(--x) var(--y));
        transition: clip-path 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        pointer-events: none; 
    }

    @keyframes rainbow-flow {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
    }

    /* --- 4. 遮罩与媒体层 --- */
    .wd-inner-mask {
        position: absolute;
        inset: 1px; 
        border-radius: 10px; 
        background: #000;
        z-index: 2;
        overflow: hidden; 
    }

    .wd-static-bg {
        position: absolute;
        inset: -10px; 
        background-image: url('/upload/2025-05-10_15.29.45.png'); 
        background-size: cover;
        background-position: center;
        filter: blur(2px);
        opacity: 1;
        transition: filter 0.5s ease, opacity 0.5s ease;
        z-index: 3; 
    }

    .wd-lazy-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        z-index: 4;
        transition: opacity 0.8s ease;
    }

    .wd-inner-mask::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 35%, transparent 60%);
        z-index: 5;
        pointer-events: none;
    }

    /* --- 5. 内容排版 --- */
    .wd-content {
        position: relative;
        z-index: 6;
        height: 100%;
        padding: 30px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        text-align: left;
    }

    .wd-title {
        font-size: 42px; 
        font-weight: 700; 
        color: #FFFFFF;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 4px 15px rgba(0,0,0,1);
        margin-bottom: 8px;
    }

    .wd-meta-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        color: #d1d5db; 
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .wd-divider {
        width: 1px;
        height: 12px;
        background: rgba(255,255,255,0.3);
        display: inline-block;
    }

    /* --- 6. 交互逻辑 --- */
    .wd-smart-card:hover .wd-rainbow-border,
    .wd-smart-card.is-playing .wd-rainbow-border {
        clip-path: circle(150% at var(--x) var(--y));
        animation-duration: 2s;
    }

    .wd-smart-card.is-playing .wd-static-bg { filter: blur(0px); opacity: 0; }
    .wd-smart-card.is-playing .wd-lazy-video { opacity: 1; }
    .wd-smart-card.is-playing {
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8); 
        transform: translateY(-3px);
        border-color: transparent; 
    }

    @media (max-width: 768px) {
        .wd-smart-card { aspect-ratio: 16 / 9; }
        .wd-title { font-size: 28px; }
        .wd-content { padding: 20px; }
        .wd-meta-bar { font-size: 13px; gap: 8px; }
    }
</style>

<div class="wander-smart-container">
    <a href="/archives/world-building" class="wd-smart-card" id="wanderCard">
        <div class="wd-rainbow-border"></div>

        <div class="wd-inner-mask">
            <div class="wd-static-bg"></div>
            <video class="wd-lazy-video" loop="" muted="" playsinline="" preload="none">
                <source src="/upload/world_preview.mp4" type="video/mp4">
            </video>

            <div class="wd-content">
                <span class="wd-title font-cn">进入流浪的世界</span>
                
                <div class="wd-meta-bar">
                    <span class="font-en">WORLD BUILDING</span>
                    <span class="wd-divider"></span>
                    <span class="font-cn">世界观与运行逻辑</span>
                </div>
            </div>
        </div>
    </a></div>

<script>
(function() {
    const card = document.getElementById('wanderCard');
    const video = card.querySelector('video');
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    function updateMousePosition(e) {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--x', (e.clientX - rect.left) + 'px');
        card.style.setProperty('--y', (e.clientY - rect.top) + 'px');
    }

    if (isMobile) {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.intersectionRatio >= 0.95) {
                    card.style.setProperty('--x', '50%'); 
                    card.style.setProperty('--y', '50%');
                    video.play().then(() => card.classList.add('is-playing')).catch(()=>{});
                } else {
                    video.pause(); 
                    card.classList.remove('is-playing');
                }
            });
        }, { threshold: [0.95] });
        observer.observe(card);
    } else {
        card.addEventListener('mouseenter', (e) => {
            updateMousePosition(e); 
            video.play().then(() => card.classList.add('is-playing')).catch(()=>{});
        });
        card.addEventListener('mousemove', updateMousePosition);
        card.addEventListener('mouseleave', (e) => {
            updateMousePosition(e); 
            video.pause(); 
            card.classList.remove('is-playing');
        });
    }
})();
</script>
