<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <link rel="icon" type="image/png" href="https://www.ryanstudio.work/upload/Icon.png">
    <title>流浪世界服务</title>
    <meta name="description" content="流浪世界服务器 — 商店系统、地图系统、建造工具与管理">
    <link rel="stylesheet" href="style.css?v=2.5.78">
    <script src="mcwws-theme.js?v=3"></script>
    <script src="mcwws-page-transition.js?v=2"></script>
    <link rel="stylesheet" href="themes.css?v=18">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="services-hub-page">
    <header class="services-hub-hero">
        <div class="services-hub-hero-glow" aria-hidden="true"></div>
        <div class="services-hub-hero-inner">
            <h1 class="services-hub-title">流浪世界服务</h1>
            <p class="services-hub-subtitle">选择要使用的系统模块</p>
        </div>
    </header>

    <main class="services-hub-main container">
        <section class="services-module-grid" aria-label="系统模块">
            <a class="services-module-card glass" href="items.html">
                <span class="services-module-icon services-module-icon--shop" aria-hidden="true">🛒</span>
                <h2 class="services-module-name">商店系统</h2>
                <p class="services-module-desc">物品目录、价格查询、交易上架与经济数据仪表板</p>
                <span class="services-module-cta">进入商店系统 →</span>
            </a>
            <a class="services-module-card glass" href="build.html">
                <span class="services-module-icon services-module-icon--build" aria-hidden="true">🏗️</span>
                <h2 class="services-module-name">建造工具</h2>
                <p class="services-module-desc">Litematica 材料清单导入批量购料、投影文件上传与游戏内粘贴</p>
                <span class="services-module-cta">进入建造工具 →</span>
            </a>
            <a class="services-module-card glass" href="map.html">
                <span class="services-module-icon services-module-icon--map" aria-hidden="true">🗺️</span>
                <h2 class="services-module-name">地图系统</h2>
                <p class="services-module-desc">BlueMap 三维地图、GIS 道路/区域标注（管理员）、商店标记与交易搜索</p>
                <span class="services-module-cta">进入地图系统 →</span>
            </a>
            <a class="services-module-card glass" href="manage/shop-locations.html">
                <span class="services-module-icon services-module-icon--manage" aria-hidden="true">⚙️</span>
                <h2 class="services-module-name">管理</h2>
                <p class="services-module-desc">UltimateShop 商店 BlueMap 位置配置（需管理员权限）</p>
                <span class="services-module-cta">进入管理 →</span>
            </a>
        </section>
    </main>

    <footer class="services-hub-footer">
        <p>流浪世界服务系统 - 由 RYAN STUDIO 制作 - <a href="https://www.ryanstudio.work" target="_blank" rel="noopener">流浪世界服务器</a></p>
    </footer>

    <script src="services-config.js?v=1"></script>
</body>
</html>
