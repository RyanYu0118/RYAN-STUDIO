<script>
/* Halo: mark page + hide TOC + widen board (when post CSS cannot use :has) */

(function () {
  var root = document.querySelector('.mcwws-web-public-home-root');
  if (!root) return;
  document.documentElement.classList.add('mcwws-web-public-home-page');
  ['toc', 'toc-body'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.style.setProperty('display', 'none', 'important');
  });
  ['#board-ctn', '#board', '.markdown-body'].forEach(function (sel) {
    var el = document.querySelector(sel);

    el.style.setProperty('max-width', 'none', 'important');
    el.style.setProperty('width', '100%', 'important');
  });
  document.querySelectorAll('.col-lg-4, .col-xl-3, #toc').forEach(function (el) {
    el.style.setProperty('display', 'none', 'important');
  });
})();

/* ═══ CSS VARIABLES ═══ */
:root {
    /* Primary Colors — 简约黑白 */
    --primary: #f5f5f5;

    /* Text Colors */
    --text-primary: #f5f5f5;

    /* Border */
    --border: rgba(255, 255, 255, 0.12);

    --glass-bg: rgba(22, 22, 22, 0.78);

    --glass-blur: 12px;

    /* Chrome */
    --navbar-bg: rgba(8, 8, 8, 0.92);
    --navbar-border: var(--border);
    --modal-overlay: rgba(0, 0, 0, 0.78);

    /* Gradients — 灰阶背景 */
    --gradient-primary: linear-gradient(135deg, #ffffff 0%, #a3a3a3 100%);
    --gradient-hero: linear-gradient(180deg, #0a0a0a 0%, #121212 50%, #0a0a0a 100%);
    --gradient-card: linear-gradient(145deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);

    /* Transitions */
    --transition-fast: 0.15s ease;
    --transition-normal: 0.3s ease;
    --transition-slow: 0.5s ease;

    /* Border Radius */
    --radius-sm: 8px;
    --radius-md: 12px;

/* ═══ RESET & BASE ═══ */

    color: #fff;
}

.form-field {
    margin-bottom: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}

.form-field label {
    color: var(--text-secondary);
    font-size: 0.9rem;
}

.form-field input {
    width: 100%;
    padding: 0.9rem 1rem;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(14, 14, 14, 0.9);
    color: var(--text-primary);
    outline: none;
    transition: var(--transition-normal);
}

.form-field input:focus {
    border-color: rgba(255, 255, 255, 0.45);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
}

.form-actions {
    text-align: right;
}

.primary-btn {
    border: none;
    background: var(--gradient-primary);
    color: #0a0a0a;
    padding: 0.85rem 1.25rem;
    border-radius: 999px;
    cursor: pointer;
    transition: var(--transition-normal);
}

.primary-btn:hover {
    transform: translateY(-1px);
}

.auth-message {
    color: var(--text-secondary);
    font-size: 0.92rem;
    margin-top: 0.75rem;
    min-height: 1.2rem;
}

.refresh-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    cursor: pointer;
    transition: var(--transition-normal);
    display: flex;
    align-items: center;
    justify-content: center;
}

.refresh-btn:hover {
    background: var(--primary);
    color: var(--on-primary, #0a0a0a);
}

.refresh-icon {
    font-size: 1.2rem;
    transition: var(--transition-normal);
}

.refresh-btn:hover .refresh-icon {
    transform: rotate(180deg);
}

.last-updated {
    font-size: 0.75rem;
    color: var(--text-muted);
}

/* ═══ HERO SECTION ═══ */
.hero {
    margin-top: 64px;
    padding: 4rem 2rem 3rem;
    background: var(--gradient-hero);
    position: relative;
    overflow: hidden;
    text-align: center;
}

.hero-content {
    position: relative;
    z-index: 1;
}

.hero-title {
    font-size: 3rem;
    font-weight: 800;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
    animation: fadeInUp 0.6s ease;
}

.hero-subtitle {
    font-size: 1.1rem;
    color: var(--text-secondary);
    animation: fadeInUp 0.6s ease 0.1s both;
}

.hero-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    pointer-events: none;
}

/* 仪表板英雄区：左侧标题 + 右侧 Minecraft 时钟 */
@font-face {
    font-family: 'MinecraftAE';
    src: url('5_Minecraft AE.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    unicode-range: U+0000-00D6, U+00D8-10FFFF;
}

.dashboard-hero {
    text-align: left;
}

.dashboard-hero .hero-inner {
    position: relative;
    z-index: 1;
    max-width: 72rem;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
}

.dashboard-hero .hero-content {
    flex: 1 1 auto;
    min-width: 0;
    text-align: left;
}

.hero-clock-widget {
    flex: 0 0 auto;
}

.hero-clock-panel {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    padding: 1rem 1.35rem;
    border-radius: var(--radius-lg);
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: linear-gradient(135deg, rgba(28, 28, 28, 0.92) 0%, rgba(14, 14, 14, 0.88) 100%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
}

.hero-clock-icon {
    flex-shrink: 0;
}

.hero-clock-icon .item-icon-mount {
    width: 5.25rem !important;
    height: 5.25rem !important;
    margin-right: 0 !important;
    background: rgba(0, 0, 0, 0.25);
    border-radius: var(--radius-md);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 24px rgba(255, 255, 255, 0.08);
}

.hero-clock-icon .item-tex-anim,
.hero-clock-icon canvas {
    width: 5.25rem !important;
    height: 5.25rem !important;
    image-rendering: pixelated;
}

.hero-clock-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.2rem;
    min-width: 9.5rem;
    font-family: 'MinecraftAE', 'Segoe UI', sans-serif;
    font-weight: normal;
}

.hero-clock-label {
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    color: var(--primary-light);
}

.hero-clock-time {
    font-family: inherit;
    font-size: 1.85rem;
    line-height: 1.15;
    color: var(--text-primary);
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.12);
}

.hero-clock-hint {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.35;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ═══ CONTAINER ═══ */
.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem;
}

/* ═══ STATS SECTION ═══ */
.stats-section {
    margin-bottom: 2rem;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
}

.stat-card {
    padding: 1.5rem;
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    gap: 1rem;
    transition: var(--transition-normal);
    position: relative;
    overflow: hidden;
}

.stat-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gradient-card);
    opacity: 0;
    transition: var(--transition-normal);
}

.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-glow);
}

.stat-card:hover::before {
    opacity: 1;
}

.stat-icon-wrap {
    width: 56px;
    height: 56px;
    border-radius: var(--radius-md);
    background: var(--bg-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
}

.stat-icon-wrap.buy {
    background: rgba(16, 185, 129, 0.2);
}

.stat-icon-wrap.sell {
    background: rgba(239, 68, 68, 0.2);
}

.stat-icon {
    font-size: 1.5rem;
}

.stat-content {
    flex: 1;
    position: relative;
    z-index: 1;
}

.stat-label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 0.25rem;
}

.stat-value {
    display: block;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text-primary);
}

.stat-trend {
    position: absolute;
    top: 1rem;
    right: 1rem;
    font-size: 0.75rem;
    padding: 0.25rem 0.5rem;
    border-radius: 999px;
    background: var(--bg-tertiary);
    color: var(--text-muted);
}

.stat-trend.positive {
    background: rgba(16, 185, 129, 0.2);
    color: var(--success);
}

.stat-trend.negative {
    background: rgba(239, 68, 68, 0.2);
    color: var(--danger);
}

/* ═══ SECTION TITLES ═══ */
.section-title {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.title-icon {
    font-size: 1.2rem;
}

/* ═══ HEALTH SECTION ═══ */
.health-section {
    padding: 1.5rem;
    border-radius: var(--radius-lg);
    margin-bottom: 2rem;
}

.health-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1rem;
}

.health-card {
    padding: 1rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    text-align: center;
    transition: var(--transition-normal);
}

.health-card:hover {
    transform: scale(1.02);
}

.health-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
}

.health-value {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-primary);
}

.health-value.positive {
    color: var(--success);
}

.health-value.negative {
    color: var(--danger);
}

.health-bar {
    height: 4px;
    background: var(--bg-secondary);
    border-radius: 2px;
    margin-top: 0.5rem;
    overflow: hidden;
}

.health-bar-fill {
    height: 100%;
    background: var(--gradient-primary);
    border-radius: 2px;
    transition: var(--transition-slow);
}

/* ═══ CHARTS SECTION ═══ */
.charts-section {
    margin-bottom: 2rem;
}

.chart-card {
    padding: 1.5rem;
    border-radius: var(--radius-lg);
}

.chart-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 1rem;
}

.time-selector {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
}

.activity-time-selector {
    flex-wrap: wrap;
    gap: 0.4rem 0.45rem;
}

.activity-time-selector .time-btn {
    padding: 0.38rem 0.7rem;
    font-size: 0.78rem;
}

.time-btn {
    padding: 0.5rem 1rem;
    border: none;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: var(--transition-normal);
}

.time-btn:hover {
    background: var(--bg-secondary);
    color: var(--text-primary);
}

.time-btn.active {
    background: var(--primary);
    color: var(--on-primary, #0a0a0a);
}

.chart-container {
    height: 300px;
    position: relative;
}

.chart-container-sm {
    height: 200px;
    position: relative;
}

/* ═══ CONTENT GRID ═══ */
.content-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

/* ═══ LEADERBOARDS ═══ */
.leaderboards-section,
.trends-section {
    padding: 1.5rem;
    border-radius: var(--radius-lg);
}

.leaderboard-tabs,
.trends-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
}

.tab-btn {
    flex: 1;
    padding: 0.75rem 1rem;
    border: none;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: var(--transition-normal);
}

.tab-btn:hover {
    color: var(--text-primary);
}

.tab-btn.active {
    background: var(--primary);
    color: var(--on-primary, #0a0a0a);
}

.leaderboard-content,
.trends-content {
    min-height: 200px;
}

.leaderboard-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    margin-bottom: 0.75rem;
    transition: var(--transition-normal);
}

.leaderboard-item:hover {
    transform: translateX(4px);
    background: var(--bg-secondary);
}

.rank {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--gradient-primary);
    color: var(--on-primary, #0a0a0a);
    font-weight: 700;
    border-radius: 50%;
    font-size: 0.85rem;
}

.rank.gold {
    background: linear-gradient(135deg, #FFD700, #FFA500);
}

.rank.silver {
    background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
}

.rank.bronze {
    background: linear-gradient(135deg, #CD7F32, #8B4513);
}

.player-avatar {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    background: var(--bg-secondary);
}

.player-info {
    flex: 1;
}

.player-name {
    font-weight: 600;
    color: var(--text-primary);
}

.player-stat {
    font-size: 0.8rem;
    color: var(--text-muted);
}

.player-value {
    font-weight: 600;
    color: var(--success);
}

/* ═══ TREND ITEMS ═══ */
.trend-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    margin-bottom: 0.75rem;
    cursor: pointer;
    transition: var(--transition-normal);
}

.trend-item:hover {
    transform: translateX(4px);
    background: var(--bg-secondary);
}

.trend-icon {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.trend-icon > div,
.dashboard-item-icon > *,
.dashboard-item-icon .item-icon-mount {
    margin-right: 0 !important;
}

.dashboard-item-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
}

.dashboard-item-label {
    display: inline-flex;
    align-items: center;
    gap: 0.65rem;
    min-width: 0;
    vertical-align: middle;
}

.dashboard-item-label > span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.trend-info {
    flex: 1;
}

.trend-name {
    font-weight: 600;
    color: var(--text-primary);
}

.trend-stats {
    font-size: 0.8rem;
    color: var(--text-muted);
}

.trend-change {
    font-weight: 600;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    font-size: 0.85rem;
}

.trend-change.positive {
    background: rgba(16, 185, 129, 0.2);
    color: var(--success);
}

.trend-change.negative {
    background: rgba(239, 68, 68, 0.2);
    color: var(--danger);
}

/* ═══ INSIGHTS SECTION ═══ */
.insights-section {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.insight-card {
    padding: 1.5rem;
    border-radius: var(--radius-lg);
}

.insight-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.insight-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.insight-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition-normal);
}

.insight-item:hover {
    transform: translateX(4px);
    background: var(--bg-secondary);
}

.insight-name {
    font-weight: 500;
    min-width: 0;
    overflow: hidden;
}

.insight-value {
    color: var(--primary-light);
    font-weight: 600;
    flex-shrink: 0;
}

/* ═══ TRANSACTIONS SECTION ═══ */
.transactions-section {
    padding: 1.5rem;
    border-radius: var(--radius-lg);
    margin-bottom: 2rem;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.section-actions {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
}

.search-box {
    position: relative;
}

.search-input {
    padding: 0.75rem 1rem;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 0.9rem;
    min-width: 200px;
    transition: var(--transition-normal);
}

.search-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
}

.filter-select {
    padding: 0.75rem 1rem;
    min-height: 2.8rem;
    line-height: 1.4;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 0.9rem;
    cursor: pointer;
    transition: var(--transition-normal);
}

.filter-select:focus {
    outline: none;
    border-color: var(--primary);
}

.scrolling-text,
.scrolling-id {
    display: block;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    vertical-align: middle;
}

.scrolling-text-inner,
.scrolling-id-text {
    display: inline-block;
    white-space: nowrap;
    transition: transform 0.2s ease;
    padding-right: 1rem;
}

@keyframes scroll-text {
    0%, 100% {
        transform: translateX(0);
    }
    50% {
        transform: translateX(var(--scroll-distance, 0));
    }
}

.scrolling-text-inner,
.scrolling-id-text {
    animation-fill-mode: forwards;
}

/* ═══ FILTER OPTIONS ═══ */
.filter-options {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
}

.filter-checkbox {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--text-secondary);
    user-select: none;
    transition: var(--transition-normal);
}

.filter-checkbox:hover {
    color: var(--text-primary);
}

.filter-checkbox input[type="checkbox"] {
    display: none;
}

.filter-checkbox .checkmark {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-tertiary);
    transition: var(--transition-normal);
}

.filter-checkbox input[type="checkbox"]:checked+.checkmark {
    background: var(--primary);
    border-color: var(--primary);
}

.filter-checkbox .checkmark::after {
    content: '';
    display: none;
    width: 5px;
    height: 10px;
    border: solid var(--on-primary, #0a0a0a);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    margin-bottom: 2px;
}

.filter-checkbox input[type="checkbox"]:checked+.checkmark::after {
    display: block;
}

.items-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.items-showing {
    font-size: 0.9rem;
    color: var(--text-muted);
}

/* ═══ TABLE ═══ */
.transactions-table-wrap {
    overflow-x: auto;
    margin-bottom: 1rem;
}

.transactions-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
}

.transactions-table th {
    padding: 1rem;
    text-align: left;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    font-weight: 600;
    border-bottom: 2px solid var(--border);
}

.transactions-table td {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
}

.transactions-table .dashboard-item-label {
    max-width: 18rem;
}

.transactions-table tbody tr {
    transition: var(--transition-fast);
    cursor: pointer;
}

.transactions-table tbody tr:hover {
    background: var(--bg-tertiary);
}

.type-badge {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
}

.type-badge.buy {
    background: rgba(16, 185, 129, 0.2);
    color: var(--success);
}

.type-badge.sell {
    background: rgba(239, 68, 68, 0.2);
    color: var(--danger);
}

.loading {
    text-align: center;
    color: var(--text-muted);
    padding: 2rem;
}

/* ═══ PAGINATION ═══ */
.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
}

.page-btn {
    padding: 0.5rem 1rem;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    cursor: pointer;
    transition: var(--transition-normal);
    font-weight: 500;
}

.page-btn:hover:not(:disabled) {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary, #0a0a0a);
}

.page-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.page-info {
    color: var(--text-secondary);
    font-size: 0.9rem;
}

/* ═══ MODAL ═══ */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    opacity: 0;
}

.modal.active,
.modal.closing {
    display: flex;
}

.modal.active {
    animation: modal-backdrop-in 0.22s ease forwards;
}

.modal.closing {
    animation: modal-backdrop-out 0.18s ease forwards;
    pointer-events: none;
}

.modal-content {
    width: 100%;
    max-width: 800px;
    max-height: 90vh;
    border-radius: var(--radius-xl);
    overflow: hidden;
    transform-origin: center;
    will-change: transform, opacity;
}

.modal.active .modal-content {
    animation: modal-card-in 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.modal.closing .modal-content {
    animation: modal-card-out 0.18s ease forwards;
}

@keyframes modal-backdrop-in {
    from {
        opacity: 0;
        background: rgba(0, 0, 0, 0);
    }
    to {
        opacity: 1;
        background: rgba(0, 0, 0, 0.8);
    }
}

@keyframes modal-backdrop-out {
    from {
        opacity: 1;
        background: rgba(0, 0, 0, 0.8);
    }
    to {
        opacity: 0;
        background: rgba(0, 0, 0, 0);
    }
}

@keyframes modal-card-in {
    from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
        filter: blur(4px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

@keyframes modal-card-out {
    from {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
    to {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
        filter: blur(3px);
    }
}

@media (prefers-reduced-motion: reduce) {
    .modal.active,
    .modal.closing,
    .modal.active .modal-content,
    .modal.closing .modal-content {
        animation-duration: 1ms;
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem;
    border-bottom: 1px solid var(--border);
}

.modal-header h2 {
    font-size: 1.5rem;
    font-weight: 600;
}

.modal-close {
    width: 40px;
    height: 40px;
    border: none;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition-normal);
}

.modal-close:hover {
    background: var(--danger);
}

.modal-body {
    padding: 1.5rem;
    max-height: 70vh;
    overflow-y: auto;
}

.modal-item-info {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.modal-item-icon {
    flex: 0 0 auto;
}

.modal-item-icon .item-icon-mount,
.modal-item-icon > * {
    margin-right: 0 !important;
}

.item-modal-stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem;
    margin: 1rem 0 0;
}

.item-modal-stat {
    background: var(--bg-tertiary);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    padding: 0.9rem 1rem;
}

.item-modal-stat-label {
    color: var(--text-muted);
    font-size: 0.78rem;
    margin-bottom: 0.3rem;
}

.item-modal-stat-value {
    color: var(--text-primary);
    font-size: 1.12rem;
    font-weight: 700;
    font-family: ui-monospace, monospace;
}

.item-modal-stat-value--buy {
    color: #34d399;
}

.item-modal-stat-value--sell {
    color: #f87171;
}

.item-modal-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-top: 0.95rem;
}

.item-modal-qty {
    min-width: 112px;
    justify-content: space-between;
    border-radius: 999px;
    overflow: hidden;
}

.item-modal-qty-btn {
    width: 36px;
    height: 36px;
    font-size: 1.05rem;
    font-weight: 600;
}

.item-modal-qty-btn:disabled {
    cursor: not-allowed;
    opacity: 0.4;
}

.item-modal-qty-value {
    min-width: 44px;
    font-size: 0.95rem;
}

.item-modal-link-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 0.55rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(14, 14, 14, 0.8);
    color: var(--text-primary);
    text-decoration: none;
    transition: var(--transition-normal);
}

.item-modal-link-btn:hover {
    border-color: rgba(255, 255, 255, 0.22);
    background: rgba(28, 28, 28, 0.95);
}

.item-detail-page {
    max-width: 1180px;
    padding-top: calc(64px + 1.5rem);
    padding-bottom: 3rem;
}

.item-detail-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1.25rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
}

.item-detail-head-main {
    display: flex;
    align-items: center;
    gap: 1rem;
    min-width: 0;
}

.item-detail-icon {
    flex-shrink: 0;
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.item-detail-icon .item-icon-mount,
.item-detail-icon > * {
    margin-right: 0 !important;
}

.item-detail-head-text {
    min-width: 0;
}

.item-detail-head h1 {
    margin: 0;
    font-size: clamp(1.8rem, 2.8vw, 2.6rem);
    color: var(--text-primary);
}

.item-detail-subtitle {
    margin: 0.4rem 0 0;
    color: var(--text-muted);
}

.item-detail-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: flex-end;
}

.item-detail-updated {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 1.25rem;
}

.item-detail-content .item-modal-chart-wrap {
    height: 360px;
}

.item-detail-content .item-modal-trade-list {
    max-height: none;
}

.item-detail-stat-grid {
    margin-top: 0;
}

.item-detail-page .item-modal-stat {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0.25rem 0;
}

.item-detail-page .item-modal-chart-wrap {
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
}

.item-detail-page .item-modal-trade-row {
    padding: 0.85rem 0;
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    background: transparent;
}

.item-detail-page .item-modal-trade-row:last-child {
    border-bottom: none;
}

.item-detail-page .item-modal-section-title:first-child {
    margin-top: 0;
}

.item-modal-action-hint {
    color: var(--text-muted);
    font-size: 0.82rem;
}

.item-modal-section-title {
    margin: 1.35rem 0 0.85rem;
    font-size: 1rem;
    color: var(--text-primary);
}

.item-history-range-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.85rem;
}

.item-history-range-tabs .tab-btn {
    flex: 0 0 auto;
    padding: 0.55rem 0.8rem;
    font-size: 0.82rem;
}

.item-modal-chart-wrap {
    height: 220px;
    padding: 0.75rem;
    border-radius: 10px;
    background: rgba(14, 14, 14, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.05);
    overscroll-behavior: contain;
    touch-action: none;
    user-select: none;
}

.item-modal-chart-wrap--interactive canvas {
    cursor: grab;
}

.item-modal-chart-wrap--interactive canvas:active {
    cursor: grabbing;
}

.item-modal-chart-hint {
    margin: -0.35rem 0 0.85rem;
    color: var(--text-muted);
    font-size: 0.78rem;
    text-align: right;
}

.item-modal-chart-wrap canvas {
    cursor: crosshair;
}

.item-modal-trade-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
}

.item-modal-trade-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.85rem 0.95rem;
    border-radius: 10px;
    background: rgba(14, 14, 14, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.item-modal-trade-time {
    color: var(--text-primary);
    font-size: 0.88rem;
    font-weight: 600;
}

.item-modal-trade-player {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-top: 0.15rem;
}

.item-modal-trade-meta {
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.6rem;
    flex-wrap: wrap;
    color: var(--text-secondary);
    font-size: 0.84rem;
}

.item-modal-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 2rem 1rem;
}

/* ═══ LOADING SPINNER ═══ */
.loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--bg-tertiary);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 2rem auto;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* ═══ FOOTER ═══ */
.footer {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
    font-size: 0.9rem;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
}

.footer a {
    color: var(--primary-light);
    text-decoration: none;
    transition: var(--transition-normal);
}

.footer a:hover {
    color: var(--primary);
    text-decoration: underline;
}

/* ═══ RESPONSIVE ═══ */
@media (max-width: 768px) {
    .navbar {
        padding: 0 1rem;
    }

    .nav-links {
        display: none;
    }

    .hero {
        padding: 3rem 1rem 2rem;
    }

    .dashboard-hero .hero-inner {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
    }

    .dashboard-hero .hero-content {
        text-align: center;
    }

    .hero-clock-widget {
        width: 100%;
    }

    .hero-clock-panel {
        justify-content: center;
    }

    .hero-clock-meta {
        align-items: center;
    }

    .hero-title {
        font-size: 2rem;
    }

    .container {
        padding: 1rem;
    }

    .stats-grid {
        grid-template-columns: 1fr;
    }

    .content-grid {
        grid-template-columns: 1fr;
    }

    .section-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .section-actions {
        width: 100%;
    }

    .search-input {
        width: 100%;
    }

    .leaderboard-tabs,
    .trends-tabs {
        flex-wrap: wrap;
    }

    .tab-btn {
        flex: 1 1 45%;
    }
}

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: var(--bg-secondary);
}

::-webkit-scrollbar-thumb {
    background: var(--bg-tertiary);
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--border);
}

/* ═══════════════════════════════════════════════════════════════════════
   ITEM CATALOG STYLES
   ═══════════════════════════════════════════════════════════════════════ */

/* ═══ ITEMS HERO ═══ */
.items-hero {
    padding-bottom: 2rem;
}

.items-hero.dashboard-hero .hero-content {
    text-align: left;
}

.items-hero .search-container {
    margin-left: 0;
    margin-right: 0;
    max-width: 32rem;
}

@media (max-width: 768px) {
    .items-hero.dashboard-hero .search-container {
        margin-left: auto;
        margin-right: auto;
    }
}

/* ═══ 首字母索引 A–Z（分页下方） ═══ */
.letter-index-bar {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: center;
    gap: 0.15rem 0.35rem;
    width: 100%;
    flex: 1 1 100%;
    margin: 0.35rem 0 0;
    padding: 0.15rem 0 0.25rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    background: none;
    border: none;
}

.letter-index-bar::-webkit-scrollbar {
    height: 3px;
}

.letter-btn {
    flex: 0 0 auto;
    min-width: auto;
    height: auto;
    padding: 0.15rem 0.4rem;
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.88rem;
    font-weight: 500;
    font-family: inherit;
    line-height: 1.2;
    cursor: pointer;
    transition: color var(--transition-fast);
}

.letter-btn:hover {
    color: var(--text-primary);
    background: transparent;
}

.letter-btn.active {
    color: var(--primary);
    font-weight: 700;
    background: transparent;
    box-shadow: none;
    transform: none;
}

.search-container {
    position: relative;
    display: inline-block;
    width: 100%;
    max-width: 500px;
    margin-top: 1.5rem;
}

.hero-search {
    width: 100%;
    max-width: 500px;
    padding: 1rem 2.75rem 1rem 1.5rem;
    font-size: 1.1rem;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-xl);
    color: var(--text-primary);
    backdrop-filter: blur(12px);
    transition: var(--transition-normal);
}

.hero-search:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.12);
}

.hero-search::placeholder {
    color: var(--text-muted);
}

.search-clear-btn {
    position: absolute;
    right: 0.65rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    padding: 0;
    border: none;
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.35rem;
    line-height: 1;
    cursor: pointer;
    transition: color var(--transition-normal), background var(--transition-normal);
}

.search-clear-btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.08);
}

.search-clear-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.28);
}

.search-clear-btn[hidden] {
    display: none;
}

/* ═══ CATEGORY SECTION ═══ */
.category-section {
    padding: 1rem;
    border-radius: var(--radius-lg);
    margin-bottom: 2rem;
}

.category-tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
}

.category-btn {
    padding: 0.75rem 1.25rem;
    background: var(--bg-tertiary);
    border: none;
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    transition: var(--transition-normal);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.category-btn:hover {
    background: var(--bg-secondary);
    color: var(--text-primary);
}

.category-btn.active {
    background: var(--primary);
    color: var(--on-primary, #0a0a0a);
}

.category-btn.active .category-count {
    background: rgba(0, 0, 0, 0.12);
    color: inherit;
}

.category-count {
    background: rgba(255, 255, 255, 0.2);
    padding: 0.125rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
}

/* ═══ ITEMS SECTION ═══ */
.items-section {
    margin-bottom: 2rem;
}

.items-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 1rem;
}

.items-showing {
    color: var(--text-secondary);
    font-size: 0.9rem;
}

/* 物品目录：分页（顶部 + 页尾） */
.page-controls.items-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    flex: 1 1 100%;
    gap: 0.75rem 1rem;
    flex-wrap: wrap;
}

.page-controls.items-pagination.items-pagination--bottom {
    justify-content: center;
    margin-top: 1.75rem;
    padding-top: 1.35rem;
    border-top: 1px solid var(--border);
}

.pagination-btn {
    min-height: 46px;
    min-width: 7.5rem;
    padding: 0.7rem 1.5rem;
    font-size: 1.05rem;
    line-height: 1.2;
    letter-spacing: 0.02em;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    cursor: pointer;
    transition: background var(--transition-fast), border-color var(--transition-fast), transform 0.15s ease;
}

.pagination-btn:hover:not(:disabled) {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary, #0a0a0a);
    transform: translateY(-1px);
}

.pagination-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
}

.pagination-info {
    font-size: 1rem;
    color: var(--text-secondary);
    min-width: 7rem;
    text-align: center;
    padding: 0 0.25rem;
}

.page-jump {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.page-jump-input {
    width: 7.5rem;
    min-width: 7.5rem;
    height: 2.5rem;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    text-align: center;
    font-size: 0.9rem;
}

.page-jump-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
}

.page-jump-btn {
    min-width: 4rem !important;
    padding: 0.5rem 1rem !important;
    font-size: 0.9rem !important;
}

/* ═══ ITEMS GRID ═══ */
.items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.5rem;
}

/* ═══ ITEM CARD ═══ */
.item-card {
    padding: 1.5rem;
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: var(--transition-normal);
    position: relative;
    overflow: hidden;
}

.item-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gradient-card);
    opacity: 0;
    transition: var(--transition-normal);
}

.item-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: var(--shadow-glow);
}

.item-card:hover::before {
    opacity: 1;
}

.item-image-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 1rem;
    position: relative;
    z-index: 1;
}

.item-image {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
    transition: var(--transition-normal);
}

.item-card:hover .item-image {
    transform: scale(1.1);
}

.item-info {
    text-align: center;
    margin-bottom: 1rem;
    position: relative;
    z-index: 1;
}

.item-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
}

.item-category {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.item-prices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1rem;
    position: relative;
    z-index: 1;
}

.price {
    padding: 0.5rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius-sm);
    text-align: center;
}

.price.buy {
    border-left: 3px solid var(--success);
}

.price.sell {
    border-left: 3px solid var(--danger);
}

.price-label {
    display: block;
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
}

.price-value {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-primary);
}

.item-stock {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    position: relative;
    z-index: 1;
}

.stock-label {
    color: var(--text-muted);
}

.stock-value {
    font-weight: 600;
    color: var(--text-primary);
}

.stock-value.low {
    color: var(--danger);
}

/* ═══ MODAL ITEM STYLES ═══ */
.modal-item-header {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
}

.modal-item-image {
    width: 80px;
    height: 80px;
    image-rendering: pixelated;
}

.modal-item-details h3 {
    font-size: 1.25rem;
    margin-bottom: 0.25rem;
}

.modal-prices {
    display: flex;
    gap: 1rem;
    margin-top: 0.75rem;
}

.modal-price {
    padding: 0.75rem 1rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius-sm);
}

.modal-price.buy {
    border-left: 3px solid var(--success);
}

.modal-price.sell {
    border-left: 3px solid var(--danger);
}

.modal-price .label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
}

.modal-price .value {
    font-size: 1.1rem;
    font-weight: 600;
}

.modal-price.buy .value {
    color: var(--success);
}

.modal-price.sell .value {
    color: var(--danger);
}

.modal-stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.modal-stat {
    padding: 1rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius-md);
    text-align: center;
}

.modal-stat .stat-label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
}

.modal-stat .stat-value {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-primary);
}

.modal-section {
    margin-bottom: 1.5rem;
}

.modal-section h4 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--text-primary);
}

.modal-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.traders-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.trader-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius-sm);
}

.trader-avatar {
    width: 24px;
    height: 24px;
    border-radius: 4px;
}

.trader-name {
    flex: 1;
    font-size: 0.85rem;
}

.trader-amount {
    font-size: 0.8rem;
    color: var(--text-muted);
}

.transactions-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: 250px;
    overflow-y: auto;
}

.tx-item {
    display: grid;
    grid-template-columns: 80px 60px 1fr auto;
    gap: 1rem;
    align-items: center;
    padding: 0.75rem;
    background: var(--bg-tertiary);
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
}

.tx-time {
    color: var(--text-muted);
}

.tx-player {
    color: var(--text-secondary);
}

.no-data {
    color: var(--text-muted);
    text-align: center;
    padding: 1rem;
    font-size: 0.9rem;
}

/* ═══ RESPONSIVE - ITEMS ═══ */
@media (max-width: 768px) {
    .items-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
    }

    .item-card {
        padding: 1rem;
    }

    .item-image {
        width: 48px;
        height: 48px;
    }

    .modal-columns {
        grid-template-columns: 1fr;
    }

    .modal-item-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .modal-prices {
        justify-content: center;
    }

    .tx-item {
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
    }
}

/* 物品目录：加入购物车按钮（原 trade-btn） */
.trade-btn,
.cart-btn {
    border: none;
    outline: none;
    cursor: pointer;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 600;
    transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
}

.trade-btn--active,
.cart-btn--active {
    background: var(--gradient-primary);
    color: #0a0a0a;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}

.trade-btn--active:hover,
.cart-btn--active:hover {
    transform: translateY(-1px);
}

.trade-btn--disabled,
.cart-btn--disabled {
    background: #334155;
    color: var(--text-muted);
    cursor: not-allowed;
    box-shadow: none;
}

.item-card-price-flash {
    animation: item-card-price-flash 0.75s ease-out;
}

@keyframes item-card-price-flash {
    0% {
        box-shadow: var(--shadow-md);
    }
    20% {
        box-shadow:
            0 0 0 1px rgba(255, 255, 255, 0.28),
            0 0 18px rgba(255, 255, 255, 0.1);
    }
    100% {
        box-shadow: var(--shadow-md);
    }
}

.item-card-clickable {
    cursor: pointer;
}

.item-card-qty {
    min-width: 112px;
    justify-content: space-between;
}

.item-card-qty-btn {
    width: 32px;
    height: 30px;
}

.item-card-qty-btn:disabled {
    cursor: not-allowed;
    opacity: 0.45;
}

.item-card-qty-value {
    min-width: 42px;
}

.cart-offer-add-btn {
    border: none;
    cursor: pointer;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.88rem;
    background: var(--gradient-primary);
    color: #0a0a0a;
}

.cart-offer-add-btn:hover {
    filter: brightness(1.08);
}

/* 导航栏购物车 */
.cart-nav-btn {
    position: relative;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition-normal);
}

.cart-nav-btn:hover {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
}

.cart-nav-btn.cart-nav-btn--pulse {
    animation: cart-nav-pulse 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes cart-nav-pulse {
    0% { transform: scale(1); }
    45% { transform: scale(1.18); }
    100% { transform: scale(1); }
}

.cart-fly-item {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 10150;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: rgba(18, 18, 18, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.04);
    will-change: transform, opacity;
    overflow: hidden;
}

.cart-fly-item .item-icon-mount,
.cart-fly-item .item-icon-3d {
    margin-right: 0 !important;
    width: 100% !important;
    height: 100% !important;
}

.cart-nav-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: #ef4444;
    color: #fff;
    font-size: 0.68rem;
    font-weight: 700;
    line-height: 18px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(239, 68, 68, 0.45);
}

/* 购物车抽屉 */
.cart-backdrop {
    position: fixed;
    inset: 0;
    z-index: 10050;
    background: rgba(8, 8, 8, 0.55);
    backdrop-filter: blur(4px);
    opacity: 0;
    transition: opacity 0.22s ease;
}

.cart-backdrop.is-visible {
    opacity: 1;
}

.cart-drawer {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 10060;
    width: min(420px, 100vw);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: rgba(14, 14, 14, 0.98);
    border-left: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: -12px 0 40px rgba(0, 0, 0, 0.35);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

.cart-drawer.is-open {
    transform: translateX(0);
}

.cart-drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.1rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.cart-drawer-title {
    margin: 0;
    font-size: 1.15rem;
    color: var(--text-primary);
}

.cart-drawer-close {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-secondary);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
}

.cart-drawer-close:hover {
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-primary);
}

.cart-drawer-body {
    flex: 1;
    overflow: auto;
    padding: 0.75rem;
}

.cart-empty {
    text-align: center;
    color: var(--text-muted);
    padding: 3rem 1rem;
    font-size: 0.95rem;
}

.cart-line {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 10px;
    align-items: start;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 12px;
    background: rgba(28, 28, 28, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.cart-line-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.cart-line-main {
    min-width: 0;
}

.cart-line-name {
    margin: 0 0 4px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.cart-line-shop {
    margin: 0 0 6px;
    font-size: 0.75rem;
    color: var(--text-muted);
}

.cart-line-price {
    font-size: 0.82rem;
    color: #34d399;
    font-family: ui-monospace, monospace;
}

.cart-line-remove {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
}

.cart-line-remove:hover {
    color: #f87171;
}

.cart-qty {
    display: inline-flex;
    align-items: center;
    gap: 0;
    margin-top: 8px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.cart-qty-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
}

.cart-qty-btn:hover {
    background: rgba(255, 255, 255, 0.18);
}

.cart-qty-value {
    min-width: 36px;
    text-align: center;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-primary);
}

.cart-drawer-footer {
    padding: 1rem 1.1rem 1.25rem;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    background: rgba(8, 8, 8, 0.35);
}

.cart-drawer-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.95rem;
    color: var(--text-secondary);
}

.cart-drawer-total-row strong {
    font-size: 1.25rem;
    color: #34d399;
    font-family: ui-monospace, monospace;
}

.cart-drawer-hint {
    margin: 0 0 12px;
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.45;
}

.cart-drawer-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.cart-drawer-btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 0.75rem 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
}

.cart-drawer-btn--ghost {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-secondary);
}

.cart-drawer-btn--ghost:hover {
    background: rgba(255, 255, 255, 0.12);
}

.cart-drawer-btn--primary {
    background: var(--gradient-primary);
    color: #0a0a0a;
}

.cart-drawer-btn--primary:hover {
    filter: brightness(1.06);
}

.cart-pending-orders {
    margin-bottom: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
}

.cart-pending-title {
    margin: 0 0 8px;
    font-size: 0.82rem;
    color: #67e8f9;
}

.cart-pending-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.cart-pending-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: #cbd5e1;
}

.cart-pending-id {
    color: #f8fafc;
    font-weight: 600;
}

.cart-pending-status {
    color: #fbbf24;
}

.cart-pending-total {
    margin-left: auto;
    color: #fde047;
}

.cart-drawer-btn--primary:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    filter: none;
}

.trade-offer-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* 上架位置弹窗、购物车：统一 MinecraftAE */
#tradeModal .modal-content,
#tradeModal .modal-header h2,
#tradeModal .modal-body,
#tradeModal .trade-modal-hint,
#tradeModal .trade-offer-card,
#tradeModal .trade-offer-card h4,
#tradeModal .trade-offer-meta,
#tradeModal .trade-offer-meta dt,
#tradeModal .trade-offer-meta dd,
#tradeModal .trade-map-link,
#tradeModal .trade-map-missing,
#tradeModal .cart-offer-add-btn,
.cart-drawer,
.cart-drawer-header,
.cart-drawer-title,
.cart-drawer-body,
.cart-drawer-footer,
.cart-line,
.cart-line-name,
.cart-line-shop,
.cart-line-price,
.cart-qty,
.cart-qty-value,
.cart-empty,
.cart-drawer-total-row,
.cart-drawer-hint,
.cart-drawer-btn {
    font-family: 'MinecraftAE', 'Segoe UI', sans-serif !important;
    font-weight: normal !important;
}

.trade-modal-hint {
    margin: 0 0 16px 0;
    color: var(--text-muted);
    font-size: 0.9rem;
}

.trade-offer-card {
    background: rgba(14, 14, 14, 0.65);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: var(--radius-md);
    padding: 14px 16px;
}

.trade-offer-card h4 {
    margin: 0 0 10px 0;
    font-size: 1rem;
    color: var(--text-primary);
}

.trade-offer-meta {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 12px;
    font-size: 0.88rem;
    color: var(--text-secondary);
}

.trade-offer-meta dt {
    margin: 0;
    color: var(--text-muted);
}

.trade-offer-meta dd {
    margin: 0;
    word-break: break-all;
}

.trade-map-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 0.85rem;
    border-radius: 999px;
    background: var(--gradient-primary);
    color: #0a0a0a;
    text-decoration: none;
    font-size: 0.85rem;
    transition: var(--transition-normal);
}

.trade-map-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
}

.trade-map-missing {
    color: var(--text-muted);
    font-size: 0.82rem;
}

/* ═══ 流浪世界服务 — 上级首页 / 模块入口 ═══ */
.services-hub-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--gradient-hero);
}

.services-hub-hero {
    position: relative;
    padding: 5rem 1.5rem 3rem;
    text-align: center;
    overflow: hidden;
}

.services-hub-hero--compact {
    padding: 4.5rem 1.5rem 2rem;
}

.services-hub-hero-glow {
    position: absolute;
    inset: -40% -20% auto;
    height: 420px;
    background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
    pointer-events: none;
}

.services-hub-hero-inner {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
}

.services-hub-kicker {
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-light);
    margin-bottom: 0.75rem;
}

.services-hub-title {
    font-size: clamp(2rem, 5vw, 3rem);
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
}

.services-hub-subtitle {
    color: var(--text-secondary);
    font-size: 1.05rem;
}

.services-hub-main {
    flex: 1;
    padding: 0 1.5rem 3rem;
    max-width: 1100px;
}

.services-module-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.25rem;
}

.services-module-grid--three {
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

.services-module-grid--shop {
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

.services-module-card {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 1.75rem 1.5rem;
    border-radius: var(--radius-xl);
    text-decoration: none;
    color: inherit;
    transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
}

.services-module-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-glow);
    border-color: var(--border-glow);
}

.services-module-icon {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.75rem;
    border-radius: 16px;
    background: var(--gradient-card);
}

.services-module-icon--shop,
.services-module-icon--map,
.services-module-icon--build,
.services-module-icon--manage {
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
}

.services-manage-page .services-hub-main {
    margin-top: 52px;
}

.services-module-name {
    font-size: 1.35rem;
    color: var(--text-primary);
}

.services-module-desc {
    font-size: 0.92rem;
    color: var(--text-muted);
    line-height: 1.55;
    flex: 1;
}

.services-module-cta {
    font-size: 0.9rem;
    color: var(--primary-light);
}

.services-hub-footer {
    padding: 1.5rem;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.88rem;
    border-top: 1px solid var(--border);
}

.services-hub-footer a {
    color: var(--accent-light);
    text-decoration: none;
}

.services-hub-footer a:hover {
    text-decoration: underline;
}

/* ========== 建造工具模块 ========== */
.services-build-page .build-hero {
    margin-bottom: 0;
}

.build-main {
    padding-bottom: 3rem;
}

.build-tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.25rem;
    margin: 2rem 0 1.5rem;
}

.build-tool-card {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 1.75rem 1.5rem;
    border-radius: var(--radius-xl);
    text-align: left;
    color: inherit;
    cursor: pointer;
    border: 1px solid var(--border-subtle);
    transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
}

.build-tool-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-glow);
    border-color: var(--border-glow);
}

.build-tool-icon {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.75rem;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
}

.build-tool-name {
    font-size: 1.35rem;
    color: var(--text-primary);
    margin: 0;
}

.build-tool-desc {
    font-size: 0.92rem;
    color: var(--text-muted);
    line-height: 1.55;
    flex: 1;
    margin: 0;
}

.build-tool-cta {
    font-size: 0.9rem;
    color: var(--primary-light);
}

.build-tool-hints {
    padding: 1.25rem 1.5rem;
    border-radius: var(--radius-xl);
}

.build-tool-hints-title {
    margin: 0 0 0.75rem;
    font-size: 1rem;
    color: var(--text-primary);
}

.build-tool-hints-list {
    margin: 0;
    padding-left: 1.25rem;
    color: var(--text-muted);
    font-size: 0.92rem;
    line-height: 1.65;
}

.build-tool-hints-list code {
    font-size: 0.85em;
    padding: 0.1em 0.35em;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.06);
}

.build-client-sync {
    margin: 0 0 1.5rem;
    padding: 1.25rem 1.5rem;
    border-radius: var(--radius-xl);
}

.build-client-sync-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
}

.build-client-sync-title {
    margin: 0 0 0.35rem;
    font-size: 1.15rem;
    color: var(--text-primary);
}

.build-client-sync-subtitle {
    margin: 0;
    font-size: 0.88rem;
    color: var(--text-muted);
}

.build-client-sync-header-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.build-client-sync-unsupported {
    margin: 0 0 0.75rem;
    padding: 0.65rem 0.85rem;
    border-radius: 10px;
    background: rgba(245, 158, 11, 0.12);
    color: #fbbf24;
    font-size: 0.88rem;
}

.build-client-sync-support-hint {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-secondary);
    border: 1px solid rgba(255, 255, 255, 0.14);
}

.build-client-sync-body {
    color: var(--text-muted);
    font-size: 0.92rem;
}

.build-client-sync-intro,
.build-client-sync-note {
    margin: 0 0 0.65rem;
    line-height: 1.6;
}

.build-client-sync-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 0.75rem 1rem;
    margin-bottom: 0.85rem;
}

.build-client-sync-paste-settings {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    margin: -0.35rem 0 0.85rem;
    padding: 0.65rem 0.8rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-tertiary);
    font-size: 0.85rem;
}

.build-client-sync-paste-settings-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 0.75rem;
}

.build-client-sync-paste-settings-label {
    color: var(--text-muted);
    flex-shrink: 0;
}

.build-client-sync-paste-settings-read {
    color: var(--text-primary);
    font-weight: 600;
}

.build-client-sync-paste-manual-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    cursor: pointer;
    color: var(--text-secondary);
    user-select: none;
}

.build-client-sync-paste-manual-toggle input {
    width: 16px;
    height: 16px;
    accent-color: var(--primary, #f5f5f5);
    cursor: pointer;
}

.build-client-sync-paste-mode-options {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
}

.build-client-sync-paste-mode-option {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.4rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.build-client-sync-paste-mode-option:has(input:checked) {
    background: var(--primary, #f5f5f5);
    color: var(--on-primary, #0a0a0a);
    border-color: transparent;
    font-weight: 600;
}

.build-client-sync-paste-mode-option:has(input:disabled) {
    opacity: 0.45;
    cursor: not-allowed;
}

.build-client-sync-paste-mode-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.build-client-sync-paste-effective {
    margin: 0;
    font-size: 0.8rem;
    color: var(--text-muted);
}

.build-client-sync-field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-width: 220px;
}

.build-client-sync-field select {
    padding: 0.45rem 0.65rem;
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    background: rgba(14, 14, 14, 0.45);
    color: var(--text-primary);
}

.build-client-sync-status {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.85rem;
    white-space: nowrap;
    flex-shrink: 0;
}

.build-client-sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45);
}

.build-client-sync-dot.is-polling {
    animation: buildClientSyncPulse 1.2s ease infinite;
}

@keyframes buildClientSyncPulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45); }
    70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

.build-client-sync-highlight {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem 1.25rem;
    align-items: center;
    padding: 0.75rem 1rem;
    margin-bottom: 0.85rem;
    border-radius: 12px;
    font-size: 0.88rem;
}

.build-client-sync-highlight strong {
    color: var(--text-primary);
}

.build-client-sync-warn,
.build-paste-client-warn {
    margin: 0 0 0.85rem;
    padding: 0.65rem 0.85rem;
    border-radius: 10px;
    background: rgba(245, 158, 11, 0.1);
    color: #fbbf24;
    font-size: 0.86rem;
    line-height: 1.55;
}

.build-client-sync-table-wrap {
    overflow: auto;
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    margin-bottom: 0.85rem;
}

.build-client-sync-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
}

.build-client-sync-table th,
.build-client-sync-table td {
    padding: 0.55rem 0.75rem;
    border-bottom: 1px solid var(--border-subtle);
    text-align: left;
    white-space: nowrap;
}

.build-client-sync-table th {
    color: var(--text-muted);
    font-weight: 600;
    background: rgba(14, 14, 14, 0.35);
}

.build-client-sync-row {
    cursor: pointer;
    transition: background 0.15s ease;
}

.build-client-sync-row:hover {
    background: rgba(255, 255, 255, 0.06);
}

.build-client-sync-row.is-selected {
    background: rgba(255, 255, 255, 0.12);
}

.build-client-sync-empty {
    text-align: center;
    color: var(--text-muted);
}

.build-client-sync-transform-tag {
    display: inline-block;
    margin-left: 0.35rem;
    padding: 0.05rem 0.35rem;
    border-radius: 999px;
    background: rgba(245, 158, 11, 0.18);
    color: #fbbf24;
    font-size: 0.75rem;
}

.build-client-sync-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

.build-client-sync-empty-help {
    margin: 0 0 0.85rem;
    padding: 0.85rem 1rem;
    border-radius: 12px;
    background: rgba(148, 163, 184, 0.08);
    border: 1px solid var(--border-subtle);
    font-size: 0.86rem;
    line-height: 1.6;
    color: var(--text-muted);
}

.build-client-sync-empty-help ul {
    margin: 0.35rem 0 0.5rem;
    padding-left: 1.2rem;
}

.build-client-sync-empty-help strong {
    color: var(--text-primary);
}

.build-client-sync-parse-hint {
    margin: 0.5rem 0 0;
    color: var(--text-muted);
    font-size: 0.82rem;
}

.build-paste-client-box {
    margin: 0.75rem 0 0.5rem;
    padding: 0.75rem 0.9rem;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.06);
}

.build-paste-client-title {
    margin: 0 0 0.45rem;
    font-size: 0.86rem;
    color: var(--text-primary);
}

.build-paste-client-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem 1rem;
    font-size: 0.85rem;
    color: var(--text-muted);
}

.build-paste-anchor-world-field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    margin-top: 0.65rem;
    font-size: 0.82rem;
    color: var(--text-muted);
}

.build-paste-anchor-world-input {
    width: 100%;
    max-width: 220px;
    padding: 0.4rem 0.55rem;
    border-radius: 8px;
    border: 1px solid rgba(148, 163, 184, 0.35);
    background: rgba(14, 14, 14, 0.35);
    color: var(--text-primary);
}

.build-paste-anchor-set .build-paste-anchor-line {
    margin: 0;
    font-size: 0.88rem;
}

.build-client-sync-paste-orders {
    margin-top: 1rem;
    padding-top: 0.75rem;
    border-top: 1px solid rgba(148, 163, 184, 0.2);
}

.build-client-sync-paste-order {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 0.75rem;
    padding: 0.55rem 0;
    font-size: 0.85rem;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
}

.build-client-sync-paste-order:last-child {
    border-bottom: none;
}

.services-subnav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0 1.25rem;
    border-radius: 0;
    border-left: 0;
    border-right: 0;
    border-top: 0;
}

.services-back-link {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.9rem;
    white-space: nowrap;
}

.services-back-link:hover {
    color: var(--primary-light);
}

.services-subnav-title {
    flex: 1;
    font-size: 0.95rem;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.services-map-auth-widget {
    flex-shrink: 0;
}

.services-open-map-btn {
    flex: 0 0 auto;
    padding: 0.4rem 0.85rem;
    border-radius: var(--radius-sm);
    background: var(--gradient-primary);
    color: #fff;
    text-decoration: none;
    font-size: 0.82rem;
    white-space: nowrap;
}

.services-open-map-btn:hover {
    filter: brightness(1.08);
}

.services-shop-page .services-hub-main {
    margin-top: 52px;
}

.services-map-page .services-map-frame-wrap {
    margin-top: 0;
    min-height: 100vh;
}

.services-map-frame-wrap {
    position: relative;
    flex: 1;
    min-height: calc(100vh - 52px - 48px);
    background: #0a0f1a;
}

.services-map-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.services-map-loading {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 0.75rem 1.25rem;
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    z-index: 2;
}

body.services-map-clean .services-map-frame-wrap {
    min-height: 100vh;
}

body.services-map-clean .services-map-auth-float {
    display: none;
}

.services-map-auth-float {
    position: absolute;
    left: 16px;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    pointer-events: none;
}

.services-map-auth-float .mcwws-auth-widget {
    pointer-events: auto;
}

.services-map-auth-float .mcwws-auth-avatar-btn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
}

.services-map-auth-float .mcwws-auth-popover {
    top: auto;
    bottom: 100%;
    right: auto;
    left: 0;
    padding: 0 0 10px;
    transform: translateY(6px);
}

.services-map-auth-float .mcwws-auth-widget:hover .mcwws-auth-popover,
.services-map-auth-float .mcwws-auth-widget.is-popover-hover .mcwws-auth-popover,
.services-map-auth-float .mcwws-auth-widget:focus-within .mcwws-auth-popover,
.services-map-auth-float .mcwws-auth-widget.is-popover-open .mcwws-auth-popover {
    transform: translateY(0);
}

.services-map-auth-float .mcwws-auth-popover-body::before {
    top: auto;
    bottom: -5px;
    left: 16px;
    right: auto;
    border-left: none;
    border-top: none;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.mcwws-auth-popover-services-link {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    margin-top: 10px;
    padding: 0.5rem 0.75rem;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-primary, #f8fafc);
    font-size: 0.85rem;
    text-decoration: none;
    transition: background 0.15s;
}

.mcwws-auth-popover-services-link:hover {
    background: rgba(255, 255, 255, 0.16);
}

.mcwws-auth-popover-theme-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-top: 10px;
    padding: 0.5rem 0.75rem;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.06);
}

.mcwws-auth-popover-theme-label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    flex-shrink: 0;
}

.mcwws-theme-switcher--popover .mcwws-theme-toggle {
    height: 32px;
}

.services-map-footer {
    flex: 0 0 auto;
}

@media (max-width: 640px) {
    .services-subnav {
        flex-wrap: wrap;
        height: auto;
        min-height: 52px;
        padding: 0.5rem 0.75rem;
    }

    .services-open-map-btn {
        width: 100%;
        text-align: center;
        margin-top: 0.25rem;
    }
}

/* Litematica 材料清单导入 */
.litematica-import-btn {
    cursor: pointer;
    min-width: 8.5rem;
    border: 1px solid rgba(52, 211, 153, 0.35);
    background: rgba(16, 185, 129, 0.12);
    color: #6ee7b7;
}

.litematica-import-btn:hover {
    background: rgba(16, 185, 129, 0.22);
}

.litematica-import-btn:hover {
    filter: brightness(1.08);
}

.build-paste-btn {
    border: 1px solid rgba(56, 189, 248, 0.45);
    background: rgba(14, 165, 233, 0.12);
    color: #e0f2fe;
    cursor: pointer;
    min-width: 7rem;
}

.build-paste-hash-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 10px 0 6px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(14, 14, 14, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.25);
}

.build-paste-hash-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.build-paste-hash-value {
    flex: 1 1 200px;
    font-size: 11px;
    word-break: break-all;
    color: #7dd3fc;
}

.build-paste-hash-hint {
    margin: 0 0 12px;
    font-size: 10px;
    color: var(--text-muted);
}

.build-paste-steps {
    margin: 0 0 16px 20px;
    color: #cbd5e1;
    font-size: 13px;
    line-height: 1.7;
}

.build-paste-steps code {
    font-size: 12px;
    color: #7dd3fc;
}

.build-paste-checkout-summary {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-bottom: 12px;
}

.build-paste-fee-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: var(--text-muted);
    font-size: 13px;
}

.build-paste-fee-row strong {
    color: #e2e8f0;
    font-weight: 600;
}

.build-paste-fee-row--total {
    padding-top: 8px;
    border-top: 1px solid rgba(148, 163, 184, 0.2);
    color: #cbd5e1;
    font-size: 14px;
}

.build-paste-fee-row--total strong {
    color: #f8fafc;
    font-size: 16px;
}

.litematica-import-modal .litematica-import-content {
    width: min(920px, 96vw);
    max-height: 90vh;
    display: flex;
    flex-direction: column;
}

.litematica-import-body {
    overflow: auto;
    max-height: calc(90vh - 150px);
}

.litematica-dropzone {
    border: 2px dashed rgba(148, 163, 184, 0.35);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    background: rgba(14, 14, 14, 0.45);
    transition: border-color 0.2s, background 0.2s;
}

.litematica-dropzone.is-dragover {
    border-color: #34d399;
    background: rgba(16, 185, 129, 0.08);
}

.litematica-dropzone-title {
    margin: 0 0 8px;
    font-size: 1.05rem;
    color: #e2e8f0;
}

.litematica-dropzone-hint {
    margin: 0 0 16px;
    color: var(--text-muted);
    font-size: 0.88rem;
}

.litematica-import-note,
.litematica-import-error {
    margin-top: 14px;
    color: var(--text-muted);
    font-size: 0.86rem;
}

.litematica-import-error {
    color: #f87171;
    padding: 16px;
    border-radius: 10px;
    background: rgba(239, 68, 68, 0.08);
