<script>
/* mcwws-theme.js */
/**
 * MCWWS 深/浅色主题切换（localStorage 持久化）
 */
(function initMcwwsColorSchemeEarly() {
    const STORAGE_KEY = 'mcwws.web.colorScheme';
    const DEFAULT_SCHEME = 'dark';

    function normalizeScheme(value) {
        return value === 'light' ? 'light' : 'dark';
    }

    function readSavedScheme() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved === 'light' || saved === 'dark') {
                return saved;
            }
            const legacyTheme = localStorage.getItem('mcwws.web.theme');
            if (legacyTheme === 'ios26-glass' || legacyTheme === 'default') {
                return DEFAULT_SCHEME;
            }
        } catch (_) { /* ignore */ }
        return DEFAULT_SCHEME;
    }

    document.documentElement.setAttribute('data-color-scheme', normalizeScheme(readSavedScheme()));
})();

const MCWWS_COLOR_SCHEME_TRANSITION_MS = 320;
const MCWWS_THEME_OVERLAY_COLORS = {
    dark: '#050505',
    light: '#ebedf2'
};

function mcwwsColorSchemeGet() {
    const current = document.documentElement.getAttribute('data-color-scheme');
    return current === 'light' ? 'light' : 'dark';
}

function mcwwsColorSchemeUpdateToggleButton(toggleBtn) {
    if (!toggleBtn) {
        return;
    }
    const scheme = mcwwsColorSchemeGet();
    toggleBtn.dataset.active = scheme;
    toggleBtn.setAttribute(
        'aria-label',
        scheme === 'light' ? '当前浅色主题，单击切换为深色' : '当前深色主题，单击切换为浅色'
    );
    toggleBtn.setAttribute('title', scheme === 'light' ? '切换为深色' : '切换为浅色');
}

function mcwwsColorSchemeSyncToggleUi() {
    mcwwsColorSchemeUpdateToggleButton(document.querySelector('.mcwws-theme-toggle'));
}

function mcwwsColorSchemeApplyCore(scheme) {
    const root = document.documentElement;
    root.setAttribute('data-color-scheme', scheme);
    try {
        localStorage.setItem('mcwws.web.colorScheme', scheme);
    } catch (_) { /* ignore */ }
    mcwwsColorSchemeSyncToggleUi();
    window.dispatchEvent(new CustomEvent('mcwws-color-scheme-change', { detail: { scheme } }));
}

function mcwwsColorSchemeOverlayTransition(fromScheme, applyCore) {
    const host = document.body || document.documentElement;
    let overlay = document.getElementById('mcwws-theme-switch-overlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'mcwws-theme-switch-overlay';
        overlay.className = 'mcwws-theme-switch-overlay';
        host.appendChild(overlay);
    }

    overlay.classList.remove('mcwws-theme-switch-overlay--out');
    overlay.style.background = MCWWS_THEME_OVERLAY_COLORS[fromScheme] || MCWWS_THEME_OVERLAY_COLORS.dark;
    overlay.style.opacity = '1';

    applyCore();

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            overlay.classList.add('mcwws-theme-switch-overlay--out');
        });
    });

    const cleanup = () => {
        overlay.classList.remove('mcwws-theme-switch-overlay--out');
        overlay.remove();
    };

    overlay.addEventListener('transitionend', (event) => {
        if (event.propertyName === 'opacity') {
            cleanup();
        }
    }, { once: true });

    window.setTimeout(cleanup, MCWWS_COLOR_SCHEME_TRANSITION_MS + 80);
}

function mcwwsColorSchemeApply(schemeId, options) {
    const animate = !options || options.animate !== false;
    const scheme = schemeId === 'light' ? 'light' : 'dark';
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const shouldAnimate = animate && !prefersReducedMotion;
    const fromScheme = mcwwsColorSchemeGet();
    const applyCore = () => mcwwsColorSchemeApplyCore(scheme);

    if (!shouldAnimate || fromScheme === scheme) {
        applyCore();
        return;
    }

    if (typeof document.startViewTransition === 'function') {
        document.startViewTransition(applyCore);
        return;
    }

    mcwwsColorSchemeOverlayTransition(fromScheme, applyCore);
}

function mcwwsColorSchemeToggle() {
    const next = mcwwsColorSchemeGet() === 'light' ? 'dark' : 'light';
    mcwwsColorSchemeApply(next);
}

function mcwwsColorSchemeBuildSwitcher() {
    const wrap = document.createElement('div');
    wrap.className = 'mcwws-theme-switcher';
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', '界面主题');

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mcwws-theme-toggle';
    btn.innerHTML = [
        '<span class="mcwws-theme-toggle-icon mcwws-theme-toggle-icon--moon" aria-hidden="true">月</span>',
        '<span class="mcwws-theme-toggle-icon mcwws-theme-toggle-icon--sun" aria-hidden="true">日</span>'
    ].join('');

    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        mcwwsColorSchemeToggle();
    });

    mcwwsColorSchemeUpdateToggleButton(btn);
    wrap.appendChild(btn);
    return wrap;
}

function mcwwsColorSchemeMountSwitcher() {
    const mapThemeSlot = document.getElementById('mapAuthThemeSlot');
    if (mapThemeSlot) {
        let switcher = document.getElementById('mcwwsThemeSwitcher');
        if (!switcher) {
            switcher = mcwwsColorSchemeBuildSwitcher();
            switcher.id = 'mcwwsThemeSwitcher';
        }
        switcher.classList.add('mcwws-theme-switcher--popover');
        if (!mapThemeSlot.querySelector('.mcwws-auth-popover-theme-label')) {
            const label = document.createElement('span');
            label.className = 'mcwws-auth-popover-theme-label';
            label.textContent = '界面主题';
            mapThemeSlot.appendChild(label);
        }
        if (!mapThemeSlot.contains(switcher)) {
            mapThemeSlot.appendChild(switcher);
        }
        mcwwsColorSchemeSyncToggleUi();
        return;
    }

    if (document.getElementById('mcwwsThemeSwitcher')) {
        mcwwsColorSchemeSyncToggleUi();
        return;
    }
    const switcher = mcwwsColorSchemeBuildSwitcher();
    switcher.id = 'mcwwsThemeSwitcher';

    const navActions = document.querySelector('.nav-actions');
    if (navActions) {
        navActions.insertBefore(switcher, navActions.firstChild);
        return;
    }

    const hubFooter = document.querySelector('.services-hub-footer');
    if (hubFooter) {
        const bar = document.createElement('div');
        bar.className = 'mcwws-theme-switcher-bar';
        bar.appendChild(switcher);
        hubFooter.insertBefore(bar, hubFooter.firstChild);
        return;
    }

    switcher.classList.add('mcwws-theme-switcher--float');
    document.body.appendChild(switcher);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mcwwsColorSchemeMountSwitcher);
} else {
    mcwwsColorSchemeMountSwitcher();
}

window.MCWWS_COLOR_SCHEME = {
    get: mcwwsColorSchemeGet,
    apply: mcwwsColorSchemeApply,
    toggle: mcwwsColorSchemeToggle,
    mountSwitcher: mcwwsColorSchemeMountSwitcher
};

</script>

    pointer-events: auto;
}
html.mcwws-pt-curtain.mcwws-pt-curtain-enter::after {
    opacity: 1;
    transition: none;
}
html.mcwws-pt-curtain.mcwws-pt-curtain-enter-active::after {
    opacity: 0;
    transition: opacity var(--page-transition-duration, 0.28s) ease;
}
`;

    if (!document.getElementById(STYLE_ID)) {
        const el = document.createElement('style');
        el.id = STYLE_ID;
        el.textContent = css;
        document.head.appendChild(el);
    }

    if (entering) {
        document.documentElement.classList.add(
            'mcwws-pt-curtain',
            'mcwws-pt-curtain-enter',
            'mcwws-pt-curtain-cover'
        );
    }
})();

const MCWWS_PAGE_TRANSITION_MS = 280;
const MCWWS_PAGE_NAV_DELAY_MS = 240;
const prefetchedHrefs = new Set();
let enterScheduled = false;

function mcwwsPageTransitionPrefersReducedMotion() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function mcwwsPageTransitionUsesNative() {
    if (mcwwsPageTransitionPrefersReducedMotion()) {
        return false;
    }
    try {
        return CSS.supports('navigation', 'auto');
    } catch (_) {
        return false;
    }
}

function mcwwsPageTransitionClearState() {
    document.documentElement.classList.remove(
        'mcwws-pt-curtain',
        'mcwws-pt-curtain-cover',
        'mcwws-pt-curtain-enter',
        'mcwws-pt-curtain-enter-active',
        'mcwws-page-exit',
        'mcwws-page-enter',
        'mcwws-page-enter-active',
        'mcwws-page-enter-pending'
    );
    try {
        sessionStorage.removeItem('mcwws.pageTransition');
    } catch (_) { /* ignore */ }
}

function mcwwsPageTransitionIsInternalLink(anchor) {
    if (!anchor || anchor.tagName !== 'A') {
        return false;
    }
    if (anchor.hasAttribute('download')) {
        return false;
    }
    const target = (anchor.getAttribute('target') || '').toLowerCase();
    if (target && target !== '_self') {
        return false;
    }
    const rawHref = anchor.getAttribute('href');
    if (!rawHref || rawHref.startsWith('#') || rawHref.startsWith('javascript:')) {
        return false;
    }
    let url;
    try {
        url = new URL(anchor.href, window.location.href);
    } catch (_) {
        return false;
    }
    if (url.origin !== window.location.origin) {
        return false;
    }
    if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) {
        return false;
    }
    return true;
}

function mcwwsPageTransitionWhenBodyReady(callback) {
    if (document.body) {
        callback();
        return;
    }
    const observer = new MutationObserver(() => {
        if (document.body) {
            observer.disconnect();
            callback();
        }
    });
    observer.observe(document.documentElement, { childList: true });
}

function mcwwsPageTransitionPlayEnter() {
    if (mcwwsPageTransitionPrefersReducedMotion()) {
        mcwwsPageTransitionClearState();
        return;
    }

    const root = document.documentElement;
    if (!root.classList.contains('mcwws-pt-curtain-enter')) {
        return;
    }

    try {
        sessionStorage.removeItem('mcwws.pageTransition');
    } catch (_) { /* ignore */ }

    root.classList.add('mcwws-page-enter');

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            root.classList.remove('mcwws-pt-curtain-enter');
            root.classList.add('mcwws-pt-curtain-enter-active', 'mcwws-page-enter-active');
            window.setTimeout(() => {
                root.classList.remove(
                    'mcwws-pt-curtain',
                    'mcwws-pt-curtain-cover',
                    'mcwws-pt-curtain-enter-active',
                    'mcwws-page-enter',
                    'mcwws-page-enter-active'
                );
            }, MCWWS_PAGE_TRANSITION_MS + 40);
        });
    });
}

function mcwwsPageTransitionScheduleEnter() {
    if (enterScheduled) {
        return;
    }
    enterScheduled = true;
    mcwwsPageTransitionWhenBodyReady(mcwwsPageTransitionPlayEnter);
}

function mcwwsPageTransitionNavigate(href) {
    if (mcwwsPageTransitionPrefersReducedMotion()) {
        window.location.href = href;
        return;
    }

    const root = document.documentElement;
    if (root.classList.contains('mcwws-page-exit')) {
        return;
    }

    root.classList.add('mcwws-pt-curtain', 'mcwws-page-exit');
    try {
        sessionStorage.setItem('mcwws.pageTransition', 'out');
    } catch (_) { /* ignore */ }

    requestAnimationFrame(() => {
        root.classList.add('mcwws-pt-curtain-cover');
    });

    window.setTimeout(() => {
        window.location.href = href;
    }, MCWWS_PAGE_NAV_DELAY_MS);
}

function mcwwsPageTransitionPrefetchHref(href) {
    if (!href || prefetchedHrefs.has(href)) {
        return;
    }
    prefetchedHrefs.add(href);
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = href;
    link.as = 'document';
    document.head.appendChild(link);
}

function mcwwsPageTransitionOnLinkPointerOver(event) {
    if (mcwwsPageTransitionUsesNative()) {
        return;
    }
    const link = event.target.closest('a[href]');
    if (!mcwwsPageTransitionIsInternalLink(link)) {
        return;
    }
    try {
        mcwwsPageTransitionPrefetchHref(new URL(link.href, window.location.href).href);
    } catch (_) { /* ignore */ }
}

function mcwwsPageTransitionOnLinkClick(event) {
    if (mcwwsPageTransitionUsesNative()) {
        return;
    }
    if (event.defaultPrevented) {
        return;
    }
    if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
    }

    const link = event.target.closest('a[href]');
    if (!mcwwsPageTransitionIsInternalLink(link)) {
        return;
    }

    let url;
    try {
        url = new URL(link.href, window.location.href);
    } catch (_) {
        return;
    }

    if (url.pathname === window.location.pathname && url.search === window.location.search && !url.hash) {
        event.preventDefault();
        return;
    }

    event.preventDefault();
    mcwwsPageTransitionNavigate(link.href);
}

function mcwwsPageTransitionInit() {
    mcwwsPageTransitionScheduleEnter();
    document.addEventListener('click', mcwwsPageTransitionOnLinkClick);
    document.addEventListener('mouseover', mcwwsPageTransitionOnLinkPointerOver, { passive: true });

    window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
            enterScheduled = false;
            mcwwsPageTransitionClearState();
            mcwwsPageTransitionScheduleEnter();
        }
    });
}

mcwwsPageTransitionScheduleEnter();

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mcwwsPageTransitionInit, { once: true });
} else {
    mcwwsPageTransitionInit();
}

window.MCWWS_PAGE_TRANSITION = {
    navigate: mcwwsPageTransitionNavigate,
    durationMs: MCWWS_PAGE_TRANSITION_MS,
    usesNative: mcwwsPageTransitionUsesNative
};

</script>
<script>
/* services-config.js */
(function () {
    const host = window.location.hostname || '127.0.0.1';
    const protocol = window.location.protocol || 'http:';
    const port = 8100;

    function applyConfig(cfg) {
        window.MCWWS_SERVICES = {
            bluemapPort: cfg.bluemapPort || port,
            bluemapUrl: cfg.bluemapUrl || `${protocol}//${host}:${cfg.bluemapPort || port}/`
        };
        window.dispatchEvent(new CustomEvent('mcwws-services-config', {
            detail: window.MCWWS_SERVICES
        }));
    }

    applyConfig({ bluemapPort: port, bluemapUrl: `${protocol}//${host}:${port}/` });

    fetch('/api/services-config', { cache: 'no-store' })
        .then((res) => (res.ok ? res.json() : null))
        .then((data) => {
            if (data && data.bluemapUrl) {
                applyConfig(data);
            }
        })
        .catch(() => { /* 使用默认端口 */ });
})();

</script>
